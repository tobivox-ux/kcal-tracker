name: Build unsigned iOS ipa (for AltStore/SideStore sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/fitness-nutrition-tracker-init-e33doy

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find workspace and scheme
        id: xcode
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned .app
        run: |
          cd ios
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package .ipa
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r kcal-tracker-unsigned.ipa Payload
          mv kcal-tracker-unsigned.ipa ..

      - uses: actions/upload-artifact@v4
        with:
          name: kcal-tracker-unsigned-ipa
          path: kcal-tracker-unsigned.ipa
          retention-days: 14
